
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OUTLAND</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;font-family:Arial;color:white}
#hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#101820cc;padding:12px 16px;border:1px solid #65717b;border-radius:10px}
#controls{position:absolute;bottom:22px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:5px}
button{background:#253743dd;color:white;border:1px solid #8a9ba6;border-radius:12px;font-size:20px;touch-action:none}
.pad button{width:48px;height:48px}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{display:flex;flex-direction:column;gap:10px}
#actions button{padding:15px;font-size:15px}
#message{position:absolute;top:85px;left:50%;transform:translateX(-50%);background:#101820dd;padding:10px;border-radius:8px;white-space:nowrap}
</style>
</head>
<body>
<div id="hud">
 <div class="panel"><b>OUTLAND</b><br>SECTOR 09</div>
 <div class="panel">SCRAP: <span id="score">0</span></div>
</div>
<div id="message">اجمع الموارد لاستكشاف العالم</div>
<div id="controls">
 <div class="pad">
  <button id="up">▲</button>
  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>
 </div>
 <div id="actions">
  <button id="collect">جمع الموارد</button>
 </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x89969b);
scene.fog = new THREE.Fog(0x89969b,25,90);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,200);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc5d9e5,0x39332d,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(15,25,10);
sun.castShadow=true;
scene.add(sun);

// الأرض
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(150,150),
 new THREE.MeshStandardMaterial({color:0x555b59})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// مباني المدينة
function building(x,z,w,h,d,color){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  new THREE.MeshStandardMaterial({color,roughness:0.9})
 );
 mesh.position.set(x,h/2,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
}
building(-8, -9,7,8,7,0x454d51);
building(8,-12,9,12,7,0x353e43);
building(-15,5,8,6,9,0x62615b);
building(14,8,10,9,8,0x424b50);
building(0,-25,18,7,6,0x4b5151);

// شخصية اللاعب
const player=new THREE.Group();
const body=new THREE.Mesh(
 new THREE.BoxGeometry(0.9,1.4,0.55),
 new THREE.MeshStandardMaterial({color:0x293c48})
);
body.position.y=1.1;
body.castShadow=true;
player.add(body);
const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.32,16,16),
 new THREE.MeshStandardMaterial({color:0xb5a18a})
);
head.position.y=2;
player.add(head);
player.position.set(0,0,5);
scene.add(player);

// موارد قابلة للجمع
const resources=[];
function makeResource(x,z){
 const obj=new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.55,0),
  new THREE.MeshStandardMaterial({
   color:0xe58b35,emissive:0x542000,roughness:0.35
  })
 );
 obj.position.set(x,0.65,z);
 obj.castShadow=true;
 scene.add(obj);
 resources.push(obj);
}
makeResource(3,2);
makeResource(-4,-3);
makeResource(7,4);
makeResource(-9,9);
makeResource(12,-4);
makeResource(2,-12);

const keys={up:false,down:false,left:false,right:false};
function bind(id,key){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();keys[key]=true;
 });
 ['pointerup','pointercancel','pointerleave'].forEach(type=>{
  el.addEventListener(type,()=>keys[key]=false);
 });
}
bind('up','up');bind('down','down');
bind('left','left');bind('right','right');

let score=0;
const scoreEl=document.getElementById('score');
const message=document.getElementById('message');

document.getElementById('collect').addEventListener('click',()=>{
 let nearest=null,dist=2.8;
 for(const r of resources){
  const d=player.position.distanceTo(r.position);
  if(d<dist){dist=d;nearest=r;}
 }
 if(nearest){
  scene.remove(nearest);
  resources.splice(resources.indexOf(nearest),1);
  score+=10;
  scoreEl.textContent=score;
  message.textContent='جمعت 10 Scrap!';
 }else{
  message.textContent='اقترب من مورد برتقالي أولاً';
 }
});

camera.position.set(0,5,10);

function animate(){
 requestAnimationFrame(animate);
 const speed=0.12;
 if(keys.up)player.position.z-=speed;
 if(keys.down)player.position.z+=speed;
 if(keys.left)player.position.x-=speed;
 if(keys.right)player.position.x+=speed;

 player.position.x=THREE.MathUtils.clamp(player.position.x,-65,65);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-65,65);

 const target=new THREE.Vector3(
  player.position.x,
  4,
  player.position.z+7
 );
 camera.position.lerp(target,0.09);
 camera.lookAt(player.position.x,1,player.position.z);

 resources.forEach(r=>{r.rotation.y+=0.015;r.rotation.x+=0.01;});
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html
